name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, unit tests, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android 36 SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Run unit tests, lint, and debug build
        run: gradle --no-daemon clean testDebugUnitTest lintDebug assembleDebug
      - name: Label APK and write build identity
        if: success()
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ANTIVIRUS-AL-AI-v0.2.0-debug.apk
          {
            echo "app=ANTIVIRUS AL AI"
            echo "version=0.2.0"
            echo "version_code=2"
            echo "commit=${GITHUB_SHA}"
            echo "workflow_run=${GITHUB_RUN_ID}"
          } > app/build/outputs/apk/debug/build-info.txt
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: antivirus-al-ai-v0.2.0-debug
          path: |
            app/build/outputs/apk/debug/ANTIVIRUS-AL-AI-v0.2.0-debug.apk
            app/build/outputs/apk/debug/build-info.txt
          if-no-files-found: error
          retention-days: 14
