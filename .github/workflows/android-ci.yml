name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Do not cancel an active validation run just because a newer commit was pushed.
# Isolate each source revision so a stuck emulator run for an older commit
# cannot keep the newest revision queued behind the same PR concurrency group.
concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Assemble, verify, and upload debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Assemble debug APK
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK package, archive, and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.antivirusalai' versionCode='3' versionName='0.3.0'"
          mkdir -p artifacts
          cp "$APK" artifacts/ANTIVIRUS-AL-AI-v0.3.0-debug.apk
          {
            echo "app=ANTIVIRUS AL AI"
            echo "version=0.3.0"
            echo "version_code=3"
            echo "commit=${GITHUB_SHA}"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "sha256=$(sha256sum "$APK" | cut -d ' ' -f 1)"
          } > artifacts/build-info.txt

      # Upload is intentionally in the build job. Test/lint/emulator failures
      # must not hide an APK that was successfully assembled and verified.
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: antivirus-al-ai-v0.3.0-debug
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  quality:
    name: Unit tests and Android lint
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Run unit tests and lint
        run: gradle --no-daemon testDebugUnitTest lintDebug

  emulator-smoke:
    name: Android startup and instrumentation (API ${{ matrix.api-level }})
    needs: [build-apk, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [33, 35]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Launch app and run instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -wipe-data
          emulator-boot-timeout: 1200
          script: |
            set -euo pipefail

            wait_for_package_manager() {
              local attempt state boot
              adb wait-for-device
              for attempt in $(seq 1 90); do
                state="$(adb get-state 2>/dev/null || true)"
                boot="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
                if [[ "$state" == "device" && "$boot" == "1" ]] && \
                   adb shell cmd package list packages >/dev/null 2>&1; then
                  echo "Android PackageManager is responsive."
                  return 0
                fi
                sleep 5
              done
              echo "Android PackageManager did not become responsive within the readiness window." >&2
              return 1
            }

            wait_for_package_manager

            TEST_LOG="$RUNNER_TEMP/android-instrumentation-attempt-1.log"
            set +e
            gradle --no-daemon connectedDebugAndroidTest --stacktrace 2>&1 | tee "$TEST_LOG"
            test_status=${PIPESTATUS[0]}
            set -e

            if [[ "$test_status" -ne 0 ]]; then
              if grep -Eqi 'Broken pipe|Failed to install split APK|Failure calling service package' "$TEST_LOG"; then
                echo "Transient emulator install/PackageManager failure detected; rebooting and retrying once."
                adb reboot || true
                adb kill-server || true
                adb start-server
                wait_for_package_manager
                gradle --no-daemon connectedDebugAndroidTest --stacktrace
              else
                exit "$test_status"
              fi
            fi

            python3 - <<'PY'
            import glob
            import xml.etree.ElementTree as ET

            reports = glob.glob(
                "app/build/outputs/androidTest-results/connected/debug/**/*.xml",
                recursive=True,
            )
            total = failures = errors = 0
            for report in reports:
                root = ET.parse(report).getroot()
                if root.tag == "testsuite":
                    suites = [root]
                else:
                    suites = list(root.iter("testsuite"))
                for suite in suites:
                    total += int(suite.attrib.get("tests", "0"))
                    failures += int(suite.attrib.get("failures", "0"))
                    errors += int(suite.attrib.get("errors", "0"))

            if total < 1:
                raise SystemExit("Instrumentation produced zero executed tests; refusing a false-green CI result.")
            if failures or errors:
                raise SystemExit(
                    f"Instrumentation failed: {total} tests, {failures} failures, {errors} errors."
                )
            print(f"Instrumentation verified: {total} tests executed with no failures.")
            PY
