name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Do not cancel an active validation run just because a newer commit was pushed.
# Isolate each source revision so a stuck emulator run for an older commit
# cannot keep the newest revision queued behind the same PR concurrency group.
concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Assemble, verify, and upload debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "cmake;3.22.1" "ndk;30.0.16248370"

      - name: Assemble debug APK
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK package, archive, and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.antivirusalai' versionCode='3' versionName='0.3.0'"
          mkdir -p artifacts
          cp "$APK" artifacts/ANTIVIRUS-AL-AI-v0.3.0-debug.apk
          {
            echo "app=ANTIVIRUS AL AI"
            echo "version=0.3.0"
            echo "version_code=3"
            echo "commit=${GITHUB_SHA}"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "sha256=$(sha256sum "$APK" | cut -d ' ' -f 1)"
          } > artifacts/build-info.txt

      # Upload is intentionally in the build job. Test/lint/emulator failures
      # must not hide an APK that was successfully assembled and verified.
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: antivirus-al-ai-v0.3.0-debug
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  quality:
    name: Unit tests and Android lint
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "cmake;3.22.1" "ndk;30.0.16248370"

      - name: Run native C++ stream matcher tests
        run: |
          set -euo pipefail
          mkdir -p build/native
          g++ -std=c++17 -Wall -Wextra -Werror \
            -I app/src/main/cpp \
            app/src/main/cpp/stream_scanner.cpp \
            app/src/test/native/stream_scanner_test.cpp \
            -o build/native/stream_scanner_test
          ./build/native/stream_scanner_test

      - name: Test threat-feed publisher source merging
        run: |
          python -m pip install --disable-pip-version-check "cryptography>=43,<47"
          python -m unittest discover -s tools -p "test_*.py"

      - name: Run unit tests and lint
        run: gradle --no-daemon testDebugUnitTest lintDebug

  emulator-smoke:
    name: Android startup and instrumentation (API ${{ matrix.api-level }})
    needs: [build-apk, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [33, 35]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "cmake;3.22.1" "ndk;30.0.16248370"

      - name: Launch app and run instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -wipe-data
          emulator-boot-timeout: 1200
          script: gradle --no-daemon connectedDebugAndroidTest --stacktrace

  release-bundle-preflight:
    name: Build and inspect unsigned release AAB
    needs: [build-apk, quality, emulator-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "cmake;3.22.1" "ndk;30.0.16248370"

      - name: Assemble release AAB (unsigned preflight only)
        run: gradle --no-daemon bundleRelease

      - name: Verify AAB structure and metadata
        shell: bash
        run: |
          set -euo pipefail
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          unzip -t "$AAB" >/dev/null
          unzip -l "$AAB" | grep -q 'base/manifest/AndroidManifest.xml'
          mkdir -p artifacts
          cp "$AAB" artifacts/ANTIVIRUS-AL-AI-v0.3.0-unsigned-preflight.aab
          {
            echo "app=ANTIVIRUS AL AI"
            echo "version=0.3.0"
            echo "version_code=3"
            echo "commit=${GITHUB_SHA}"
            echo "signing=UNSIGNED - NOT FOR PLAY UPLOAD"
            echo "sha256=$(sha256sum "$AAB" | cut -d ' ' -f 1)"
          } > artifacts/aab-build-info.txt

      - name: Upload unsigned AAB preflight artifact
        uses: actions/upload-artifact@v4
        with:
          name: antivirus-al-ai-v0.3.0-unsigned-aab-preflight
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
