name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Keep an active build alive when a newer commit is pushed. GitHub will retain
# only the newest pending run for a concurrency group.
concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build, unit tests, lint, and upload APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android 36 SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Run unit tests, lint, and debug build
        run: gradle --no-daemon clean testDebugUnitTest lintDebug assembleDebug
      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          mkdir -p artifacts
          cp "$APK" artifacts/ANTIVIRUS-AL-AI-v0.3.0-debug.apk
          {
            echo "app=ANTIVIRUS AL AI"
            echo "version=0.3.0"
            echo "version_code=3"
            echo "commit=${GITHUB_SHA}"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "sha256=$(sha256sum "$APK" | cut -d ' ' -f 1)"
          } > artifacts/build-info.txt
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: antivirus-al-ai-v0.3.0-debug
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  emulator-smoke:
    name: Android emulator launch and instrumentation tests
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android 36 SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Launch app and run instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -wipe-data
          emulator-boot-timeout: 900
          script: gradle --no-daemon connectedDebugAndroidTest --stacktrace
