name: Publish signed offline content rules

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Check signing-key configuration or publish reviewed rules"
        type: choice
        options:
          - check-key
          - publish
        default: check-key
        required: true
  schedule:
    - cron: "31 */12 * * *"

permissions:
  contents: write

# Serialize with the hash-feed publisher because both update security-feed.
concurrency:
  group: alai-threat-feed-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    name: Build and publish signed offline content rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout publisher source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install publisher dependency
        run: python -m pip install --disable-pip-version-check "cryptography>=43,<47"

      - name: Verify configured signing key (no publishing)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.operation == 'check-key'
        env:
          ALAI_FEED_SIGNING_KEY_PEM: ${{ secrets.ALAI_FEED_SIGNING_KEY_PEM }}
        run: |
          set -euo pipefail
          python tools/publish_content_rules.py \
            --input threat-intel/content-rules-reviewed.csv \
            --output "$RUNNER_TEMP/key-check-unused.alrules" \
            --check-key-only

      - name: Generate and publish signed rule bundle
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.operation != 'check-key'
        env:
          ALAI_FEED_SIGNING_KEY_PEM: ${{ secrets.ALAI_FEED_SIGNING_KEY_PEM }}
          ALAI_CONTENT_RULES_REVIEWED: ${{ secrets.ALAI_CONTENT_RULES_REVIEWED }}
          ALAI_CONTENT_RULES_COMMERCIAL_USE_APPROVED: ${{ secrets.ALAI_CONTENT_RULES_COMMERCIAL_USE_APPROVED }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin security-feed --depth=1 || true
          PREVIOUS_VERSION="$RUNNER_TEMP/previous-content-version"
          : > "$PREVIOUS_VERSION"
          if git cat-file -e origin/security-feed:content-rules/version 2>/dev/null; then
            git show origin/security-feed:content-rules/version > "$PREVIOUS_VERSION"
          fi

          python tools/publish_content_rules.py \
            --input threat-intel/content-rules-reviewed.csv \
            --output "$RUNNER_TEMP/latest.alrules" \
            --previous-version "$PREVIOUS_VERSION"

          if git ls-remote --exit-code origin refs/heads/security-feed >/dev/null 2>&1; then
            git checkout -B security-feed origin/security-feed
          else
            git checkout --orphan security-feed
            git rm -rf . >/dev/null 2>&1 || true
            git clean -fdx
          fi

          mkdir -p content-rules
          cp "$RUNNER_TEMP/latest.alrules" content-rules/latest.alrules
          grep '^version=' content-rules/latest.alrules | cut -d= -f2 > content-rules/version

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content-rules/latest.alrules content-rules/version
          git commit -m "Publish signed content rules v$(cat content-rules/version)"
          git push origin HEAD:security-feed
