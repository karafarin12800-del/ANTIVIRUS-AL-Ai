name: Publisher release signing verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sign-and-verify-aab:
    name: Sign and verify publisher AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require protected publisher signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD EXPECTED_CERT_SHA256; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required publisher secret is missing: ${name}"
              exit 1
            fi
          done
          normalized="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          if [[ ! "$normalized" =~ ^[A-F0-9]{64}$ ]]; then
            echo "::error::ANDROID_RELEASE_CERT_SHA256 must be a SHA-256 certificate fingerprint."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "cmake;3.22.1" "ndk;30.0.16248370"

      - name: Provision keystore in runner temporary directory
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/antivirus-al-ai-publisher.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "ALAI_RELEASE_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build publisher-signed release AAB
        shell: bash
        env:
          ALAI_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ALAI_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ALAI_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon clean bundleRelease
          test -s app/build/outputs/bundle/release/app-release.aab

      - name: Verify AAB signature and pinned publisher certificate
        shell: bash
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          AAB="app/build/outputs/bundle/release/app-release.aab"
          unzip -t "$AAB" >/dev/null
          jarsigner -verify -verbose -certs "$AAB" > "$RUNNER_TEMP/jarsigner-report.txt"
          grep -Eiq 'jar verified\.' "$RUNNER_TEMP/jarsigner-report.txt"
          actual="$(keytool -printcert -jarfile "$AAB" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          expected="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          if [[ -z "$actual" || "$actual" != "$expected" ]]; then
            echo "::error::Publisher certificate fingerprint mismatch. AAB will not be uploaded."
            exit 1
          fi
          mkdir -p artifacts
          cp "$AAB" artifacts/ANTIVIRUS-AL-AI-v0.3.0-publisher-signed.aab
          {
            echo "app=ANTIVIRUS AL AI"
            echo "version=0.3.0"
            echo "version_code=3"
            echo "commit=$GITHUB_SHA"
            echo "aab_sha256=$(sha256sum "$AAB" | cut -d ' ' -f 1)"
            echo "publisher_certificate_sha256=$actual"
            echo "signature_verification=PASS"
          } > artifacts/publisher-signature-verification.txt

      - name: Upload verified publisher-signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: antivirus-al-ai-v0.3.0-publisher-signed-aab
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/antivirus-al-ai-publisher.jks"
